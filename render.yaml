services:
  - type: web
    name: hostel-complaint-portal-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://hostel-complaint-portal.vercel.app
    disk:
      name: hostel-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
